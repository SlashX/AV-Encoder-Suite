# Burn-in HUD layout preset: minimal
# Top-left: timestamp · Top-right: speed
# Compact, useful pentru cinematic clips care vor doar context minim

PRESET_NAME=minimal
PRESET_DESC=Minimal — timestamp + speed only (corners)

# Frame size (auto-set from input video by render engine if AUTO)
FRAME_W=AUTO
FRAME_H=AUTO

# HUD components enabled
HUD_TIMESTAMP=1
HUD_SPEED=1
HUD_ALTITUDE=0
HUD_HEADING=0
HUD_TEMPERATURE=0
HUD_MAP=0
HUD_GFORCE=0
HUD_HR=0
HUD_DATA_STRIP=0

# Positions (corner anchors: tl/tr/bl/br with px offset)
POS_TIMESTAMP=tl:24,24
POS_SPEED=tr:24,24

# Style
FONT_FAMILY=DejaVu Sans
FONT_SIZE_LARGE=28
FONT_SIZE_MEDIUM=20
FONT_COLOR=white
SHADOW_COLOR=black
SHADOW_OFFSET=2

# Speed units (mps|kmh|mph)
SPEED_UNIT=kmh
