# Burn-in HUD layout preset: data-strip
# Bottom bar 80px cu speed / alt / heading / temp (data-log style)
# Util pentru clipuri sport / vlog cu focus pe metrici live

PRESET_NAME=data-strip
PRESET_DESC=Data-strip — bottom bar with speed/alt/heading/temp

FRAME_W=AUTO
FRAME_H=AUTO

# HUD components
HUD_TIMESTAMP=1
HUD_SPEED=1
HUD_ALTITUDE=1
HUD_HEADING=1
HUD_TEMPERATURE=1
HUD_MAP=0
HUD_GFORCE=0
HUD_HR=0
HUD_DATA_STRIP=1

# Strip layout
STRIP_HEIGHT=80
STRIP_BG_COLOR=#000000
STRIP_BG_ALPHA=0.55
STRIP_POSITION=bottom

# Strip content order (left to right)
STRIP_FIELDS=timestamp,speed,altitude,heading,temperature

# Style
FONT_FAMILY=DejaVu Sans
FONT_SIZE_LARGE=24
FONT_SIZE_MEDIUM=18
FONT_SIZE_LABEL=14
FONT_COLOR=white
LABEL_COLOR=#aaaaaa

SPEED_UNIT=kmh
