# Burn-in HUD layout preset: full
# Full — data-strip + corner map M2 + extra gauges
# Data-strip + corner map M2 (route + animated dot) + extra gauges
# Layout complet pentru archive / sharing — toate informatiile disponibile

PRESET_NAME=full

# HUD components
HUD_TIMESTAMP=1
HUD_SPEED=1
HUD_MAP=1
HUD_GFORCE=1
HUD_HR=1
HUD_DATA_STRIP=1

# Strip
STRIP_HEIGHT=80
STRIP_BG_COLOR=#000000
STRIP_BG_ALPHA=0.55
STRIP_POSITION=bottom
STRIP_FIELDS=timestamp,speed,altitude,heading,temperature

# Map M2 (corner)
MAP_SIZE=220
MAP_POSITION=tr
MAP_OFFSET_X=24
MAP_OFFSET_Y=24
MAP_BG_COLOR=#000000
MAP_BG_ALPHA=0.45
MAP_ROUTE_COLOR=#00aaff
MAP_ROUTE_WIDTH=2
MAP_DOT_COLOR=#ff3333
MAP_DOT_SIZE=8

# Extra gauges (auto-skip daca brandul nu produce datele)
POS_GFORCE=tl:24,24
POS_HR=tl:24,80

# Style
FONT_SIZE_LARGE=24
FONT_SIZE_MEDIUM=18
FONT_SIZE_LABEL=14
FONT_COLOR=white
LABEL_COLOR=#aaaaaa
SHADOW_COLOR=black
SHADOW_OFFSET=2
# Optional: font custom — nume de familie matplotlib SAU cale .ttf/.otf. Gol = default.
#FONT_FAMILY=monospace
# NB: gauge-urile de colt ALT/HDG/TEMP (HUD_ALTITUDE/HEADING/TEMPERATURE) sunt
# active doar cand HUD_DATA_STRIP=0 — aici strip-ul le afiseaza deja (vezi minimal.conf).

SPEED_UNIT=kmh
