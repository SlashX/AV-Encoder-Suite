# Burn-in HUD layout preset: full
# Data-strip + corner map M2 (route + animated dot) + extra gauges
# Layout complet pentru archive / sharing — toate informatiile disponibile

PRESET_NAME=full
PRESET_DESC=Full — data-strip + corner map M2 + extra gauges

FRAME_W=AUTO
FRAME_H=AUTO

# HUD components
HUD_TIMESTAMP=1
HUD_SPEED=1
HUD_ALTITUDE=1
HUD_HEADING=1
HUD_TEMPERATURE=1
HUD_MAP=1
HUD_GFORCE=1
HUD_HR=1
HUD_DATA_STRIP=1

# Strip
STRIP_HEIGHT=80
STRIP_BG_COLOR=#000000
STRIP_BG_ALPHA=0.55
STRIP_POSITION=bottom
STRIP_FIELDS=timestamp,speed,altitude,heading,temperature

# Map M2 (corner)
MAP_SIZE=220
MAP_POSITION=tr
MAP_OFFSET_X=24
MAP_OFFSET_Y=24
MAP_BG_COLOR=#000000
MAP_BG_ALPHA=0.45
MAP_ROUTE_COLOR=#00aaff
MAP_ROUTE_WIDTH=2
MAP_DOT_COLOR=#ff3333
MAP_DOT_SIZE=8

# Extra gauges (auto-skip daca brandul nu produce datele)
POS_GFORCE=tl:24,24
POS_HR=tl:24,80

# Style
FONT_FAMILY=DejaVu Sans
FONT_SIZE_LARGE=24
FONT_SIZE_MEDIUM=18
FONT_SIZE_LABEL=14
FONT_COLOR=white
LABEL_COLOR=#aaaaaa
SHADOW_COLOR=black
SHADOW_OFFSET=2

SPEED_UNIT=kmh
